name: CI

on:
  push:
    branches: [master, 'train/**']
  pull_request:
  # Reusable so release.yml gates publish on the exact same matrix —
  # release-time and PR-time CI can never drift.
  workflow_call:
  # The push gate asks "is this change good"; this run asks "is what already
  # landed still good against the world as it is now". This workspace has no
  # sibling path dependencies, so the world that moves under it is the
  # toolchain (`@stable` grows lints that redden a green master) and the
  # registry. A red here with no commit of ours is that class, not a
  # regression, and it must not wait for the next unrelated push to surface.
  schedule:
    # *** DO NOT CHANGE THIS CRON BEFORE 2026-11-02. *** It is a load-bearing
    # arm of a three-repo measurement and changing it would not FAIL -- the
    # numbers would keep arriving and would simply mean something else.
    #
    # Deliberately NOT on the hour. Measured 2026-09-20 across two repos with
    # identical `0 6 * * *` declarations: subconscious n=14 mean +4h19m (range
    # +3h40m..+5h02m), fusiform n=13 mean +4h31m (+3h50m..+5h19m). A stable
    # ~4.5h SHIFT with ~40m of jitter on top, not the load jitter GitHub
    # documents.
    #
    # THE MINUTE QUESTION IS CLOSED and this line no longer tests it. CEREB's
    # `17 4` (n=14, mean +4h54m, +4h22m..+5h36m) lands between the two `0 6`
    # series, and their 04:17 declaration delivers ~1h20m EARLIER than the
    # 06:00 ones -- so delivery tracks the declared time and the delay does not
    # key on the popular `0` minute.
    #
    # Two models now fit every series and predict this line's delivery to
    # within two minutes of each other:
    #     constant offset   declared + ~4.5h
    #     timezone          declared read as US Eastern (UTC-4) + 20-55m jitter
    # Agreement is evidence only if the instruments could have disagreed, and
    # these cannot -- so this declaration is kept as a fourth data point, not as
    # a test. The discriminator is the 2026-11-01 US Eastern DST boundary
    # (UTC-4 -> UTC-5, checked against the tz database): under the timezone
    # model the UTC delivery shifts an hour, under a true offset it does not.
    # fusiform is held at `0 6` through that boundary as the control, so a repo
    # that changed NOTHING separates a scheduler change from a timezone change.
    #
    # The immediate reading is a PAIR, not an absolute (CEREB's instrument):
    # this repo's `17 3` sits exactly one hour before cerebellum's `17 4`, so
    # on any given morning the GAP between the two deliveries measures the
    # slope with the day's congestion cancelled as common-mode. A stable 60m
    # gap means delivery tracks declaration 1:1 and kills every "partly tracks"
    # story; FUSI's three-point estimate could only bound the slope at ~0.78
    # with a spread that also admits 1.0. The gap is degenerate across the two
    # live models above -- both predict 60m -- so it sharpens, it does not
    # discriminate.
    #
    # WHY THIS LINE IS ALSO A WITHIN-REPO CONTROL, which was not the reason it
    # was moved. CEREB's one-sided test (delivery cannot precede the declared
    # time, so each repo's EARLIEST observation bounds any timezone reading)
    # falsifies UTC-5 on all three repos and UTC-4 on two: subconscious's
    # `0 6` would have to land no earlier than 10:00Z and its minimum is
    # 09:40Z, fusiform's 09:50Z. The test is conservative in the safe
    # direction -- a sample minimum can only FALL with more data -- so those
    # margins are floors on the violation. What survives (UTC-3 and east) does
    # so only by inflating the implied jitter until "timezone" and "constant
    # offset" are the same functional form: declared + constant + non-negative
    # jitter, separable ONLY by whether the constant moves on a DST boundary.
    #
    # That left one unexplained term: the three minima are +3h40m, +3h50m,
    # +4h22m, and cerebellum sits 42m above this repo at comparable n. A
    # cross-repo pair cannot resolve it, because a shared constant is exactly
    # the common-mode noise same-morning pairing cancels. THIS repo at `17 3`
    # against THIS repo's own `0 6` history (n=14, mean +4h19m, min +3h40m)
    # is the comparison that can: same repo, org, workflow and runners, only
    # the declared time changed, so every per-repo term cancels. Constant
    # offset predicts the new series reproduces ~+4h19m.
    #
    # RESULT (read 2026-09-27, seven mornings 09-21..09-27): constant offset is
    # FALSIFIED. From `17 3` this repo delivered at mean +5h34m (min +5h17m,
    # max +6h05m) against +4h19m from `0 6`. Against fusiform's unmoved `0 6`
    # on the same mornings, the difference-in-differences is +55m (se 6m):
    # declaring 163m earlier bought only ~108m earlier delivery. Any timezone
    # reading shifts both periods equally, so it cannot absorb this; the delay
    # itself depends on WHEN the job fires, longer for an earlier fire. Rough
    # slope over this range: ~20m of extra delay per hour earlier.
    #
    # Consequence for the boundary below: the one-hour separation assumes each
    # repo's residual is constant across the transition. With a fire-time
    # dependent delay, a fire that moves an hour later also waits ~20m less,
    # so expect nearer 40m of separation than 60m. The slope is measured over
    # 03:17-06:00 only, so treat 40m as an estimate, not a prediction.
    #
    # READING THE BOUNDARY. Transition instant is 2026-11-01T06:00:00Z, located
    # by binary search against the tz database rather than by the
    # first-Sunday rule (a daily 00:00Z sample cannot locate an instant inside
    # a day, and that artefact gave a wrong date by one on two seats' first
    # attempt). This repo's 03:17 and cerebellum's 04:17 are both clean on
    # 11-01 -- each is well clear of 06:00Z and after the 02:00 local fallback.
    #
    # *** THE OBSERVABLE SEPARATION IS ONE HOUR, NOT FIVE. *** An earlier
    # version of this comment said the fire time moves five hours, which is
    # true and unmeasurable: we observe `createdAt`, never the fire. The two
    # models differ only in what they put BETWEEN fire and createdAt --
    # eastern puts 20-55m of ordinary queue delay there, utc puts ~4.5h of
    # backlog -- and the 5h fire-time gap is almost exactly cancelled by it.
    # Each repo carries its OWN measured residual across the boundary, so the
    # per-repo term cancels and every arm separates by the same hour:
    #     this repo   utc 07:36Z   eastern 08:36Z
    #     cerebellum  utc 09:11Z   eastern 10:11Z
    #     fusiform    utc 10:31Z   eastern 11:31Z
    # Expecting five would make a clean positive unreadable: seeing ~08:36Z
    # against a 5h prediction reads as "neither model fits" when it is the
    # eastern model landing within twenty minutes.
    # fusiform's `0 6` is NOT readable on 11-01: 06:00Z is the transition
    # instant to the second, so which side it resolves on is an implementation
    # detail no model predicts. Its clean row is 11-02.
    # Re-measure with:
    #   gh run list --workflow CI --event schedule --limit 20 \
    #     --json createdAt --jq '.[].createdAt'
    # Until that resolves: anything asking "did the nightly fire?" must size its
    # window from the OBSERVED delivery distribution, never from this line.
    - cron: '17 3 * * *'

concurrency:
  # Deliberate: rapid pushes to the same ref cancel the earlier runs, so only the
  # tip is verified. That saves runner minutes and is the right trade for a
  # branch whose intermediate commits are not independently deployed.
  #
  # THE ACCEPTED COST, stated because it has misled a reader three times: a run
  # list showing passes is a claim about the TIP, never about each commit. A
  # commit that changes CI logic will usually have its OWN run cancelled by the
  # next push, and the first completed run carrying that change belongs to a
  # later, often unrelated, commit. When verifying a workflow edit, find the run
  # whose head actually contains it rather than reading the newest green.
  #
  # Anything that needs per-commit evidence (a bisect, a release tag) must not
  # rely on this workflow's history -- release.yml deliberately puts the SHA in
  # its own group for exactly that reason.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux + Windows matrix. subc's transport (loopback TCP + key auth) and the
  # cortexkit-paths-backed canonicalization must behave identically across
  # platforms; Windows is the load-bearing leg because the cfg(windows) paths
  # and verbatim-path canonicalization cannot be exercised by local
  # macOS/Linux development. macOS is intentionally NOT in CI: it is the
  # development platform (continuously exercised by local cargo test + clippy)
  # and macOS-vs-Linux divergence risk is low (both POSIX).
  #
  # Runners are Blacksmith, not GitHub-hosted: these repos are owned by a
  # free-plan organization, where GitHub bills private-repo Actions minutes and
  # blocks jobs once the (zero) spending limit is hit. Blacksmith third-party
  # runners do not consume GitHub's included minutes, so CI runs without an org
  # billing change. Revert `runner` to the GitHub-hosted `ubuntu-latest` /
  # `windows-latest` labels if the repo becomes public (public-repo Actions
  # minutes are free), at which point macOS can be re-added.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Paired with the post-build check at the end of this job. Snapshotting
      # first means the property tested is "the build rewrote a tracked file"
      # rather than "the tree is clean" — the latter is satisfied by a fresh CI
      # checkout for reasons unrelated to the build, so it would pass here while
      # being useless anywhere a tree can legitimately carry other changes.
      - name: Snapshot tree state
        run: git status --porcelain | sort > "$RUNNER_TEMP/tree-before.txt"
        shell: bash

      # ck-bus's A1 acceptance rows supervise the REAL nats-server binary under
      # protocol:none; the spec forbids a stand-in for that arm, so the binary
      # must exist on every unix leg or the rows fail at their precondition.
      # Pinned by version and by the sha256 of the release tarball, checked
      # before extraction, so a replaced upstream asset fails here loudly
      # instead of changing what the test measures. Windows skips A1 by design
      # (the row records a1-signal-unix-only), so it needs no install.
      - name: Install nats-server (ck-bus A1 rows)
        if: ${{ matrix.os == 'ubuntu' }}
        shell: bash
        run: |
          set -euo pipefail
          v=v2.15.0
          sum=5d2c51caca950333aba84911df7d377f826f3a59ec36061c6539105084f65c92
          tgz="$RUNNER_TEMP/nats-server.tar.gz"
          curl -fsSL -o "$tgz" "https://github.com/nats-io/nats-server/releases/download/$v/nats-server-$v-linux-amd64.tar.gz"
          echo "$sum  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nats-server-$v-linux-amd64" >> "$GITHUB_PATH"

      - name: Format check
        run: cargo fmt --all -- --check

      # Guarded for the same reason the test step is, one gate earlier. The
      # format check is the cheapest and most easily tripped check in this file,
      # and an unguarded lint step means a stray blank line cancels every lint AND
      # test answer below it. The job then shows one red mark that a reader cannot
      # distinguish from "style problem, code fine".
      #
      # THE FORMAT CHECK ITSELF STAYS UNGUARDED, deliberately: everything before
      # it is setup, so if that fails the toolchain is absent and this check is
      # IMPOSSIBLE rather than skipped-by-policy. The guard is only meaningful on
      # a check that follows another CHECK.
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # --all-targets lints the dev profile only, so warnings inside
      # #[cfg(not(debug_assertions))] (or release-only dead code) never fail the
      # gate above. Lint the release profile too so those surface in CI.
      - name: Clippy (release profile)
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --release --locked -- -D warnings

      # Runs even when a lint step above failed, because a lint failure must not
      # silently suppress the test signal. A sibling repo lost twenty commits of
      # test coverage to exactly that: a tolerated clippy failure kept the job
      # red for weeks, the test step never ran, and every fix shipped in that
      # window reached production ungated. A red job that means "lint failed and
      # tests passed" is honest; one that means "lint failed and tests are
      # unknown" is not, and the two are indistinguishable from the outside.
      # The full suite finishes in minutes on every platform (the whole
      # cross-built set ran in under three minutes on a Windows VM). A step
      # that is still running at this bound is hung, and a hung step must end
      # by timeout rather than by the runner dying: a timed-out step keeps its
      # log, and libtest names any test that has run for over sixty seconds in
      # that log, while a runner that loses communication with the server
      # uploads nothing (2026-09-09, Windows, 2h46m, no log).
      - name: Test
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: cargo test --workspace --all-targets --locked

      # --all-targets does NOT include doctests, despite the name: it expands to
      # --lib --bins --tests --benches --examples. So a doc example that stops
      # compiling leaves the gate green. The workspace has no runnable doc
      # examples today, which is exactly why this is worth wiring now rather than
      # later -- the first one added would otherwise arrive unchecked, and nobody
      # would be looking for a gap whose current cost is zero.
      - name: Doc tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --doc --locked

      # A generated file edited by hand is invisible to every test: the suite
      # passes, and the only symptom is that the generator rewrites the file on
      # the next build. A sibling repo hit this with a Cargo.lock entry written
      # at a different indent than cargo emits — green gate, and a tree that
      # dirtied itself on every build, which would have blocked that repo's own
      # mason dispatch (it refuses a dirty parent checkout). By this point the
      # steps above have built every target, so anything cargo intended to
      # rewrite has been rewritten.
      #
      # Compares against the snapshot rather than requiring an empty tree, so
      # the delta is attributable to the build. Pre-existing changes appear in
      # both snapshots and cancel; only what the build touched survives.
      - name: Build did not modify tracked files
        if: ${{ !cancelled() }}
        run: |
          git status --porcelain | sort > "$RUNNER_TEMP/tree-after.txt"
          if ! diff -q "$RUNNER_TEMP/tree-before.txt" "$RUNNER_TEMP/tree-after.txt" >/dev/null; then
            echo "the build rewrote tracked files:" >&2
            diff "$RUNNER_TEMP/tree-before.txt" "$RUNNER_TEMP/tree-after.txt" >&2 || true
            git diff >&2
            exit 1
          fi
        shell: bash

      # Seven repos consume this repo's crates BY RELATIVE PATH and float to its
      # HEAD. A path dependency is recorded in their Cargo.lock as a bare version
      # string with no source and no checksum, so `--locked` over there cannot see
      # that the code moved -- only that the version did. Measured when this was
      # found: subc-protocol had 5 source commits in 30 days and 0 version bumps.
      #
      # Linux only: the check reads git history, which is platform-independent,
      # and running it twice would report the same violation twice.
      - name: Cross-repo crates moved with their versions
        if: ${{ !cancelled() && matrix.os == 'ubuntu' }}
        run: |
          # A push compares against its own before-state; a PR against its base.
          # Both are fetched shallow by default, so deepen enough to resolve them.
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # An all-zero or empty before-sha means a new branch or a force push,
          # where there is no meaningful base. Skip LOUDLY: silence here would be
          # indistinguishable from a pass.
          case "$BASE" in
            ""|0000000000000000000000000000000000000000)
              echo "no resolvable base for this event -- version drift NOT checked"
              exit 0
              ;;
          esac
          # Deepen until BASE and HEAD actually CONNECT, not until a fetch
          # succeeds: a depth-50 fetch of BASE can succeed while the shallow
          # boundary still separates it from a depth-1 HEAD, and merge-base
          # then fails on two perfectly valid SHAs (bit us on the first
          # GitHub-runner push after the Blacksmith migration).
          git fetch --depth=50 origin "$BASE" 2>/dev/null || true
          if ! git merge-base "$BASE" HEAD >/dev/null 2>&1; then
            git fetch --unshallow origin 2>/dev/null || git fetch --depth=2147483647 origin || true
          fi
          bash scripts/fleet/check-wire-crate-versions.sh "$BASE"
        shell: bash

  # The TypeScript packages ship from this repo and are wire-compatible with the
  # Rust crates, so their typecheck + tests gate here too — otherwise a TS-only
  # break (e.g. a private-member test-harness type error) stays invisible until a
  # release workflow that runs typecheck fails.
  #
  # @cortexkit/store was in exactly that position: declared scripts, a passing
  # suite, and no PR-time job running either. Release-time checks are not a gate,
  # because they only report once someone is already publishing — the failure
  # arrives attached to the one action you least want to abort.
  ts-client:
    name: TS (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [subc-client, store, log]
    defaults:
      run:
        working-directory: clients/${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        # No fallback. --frozen-lockfile fails only when the committed lock
        # disagrees with package.json; falling back to a plain install makes CI
        # resolve fresh versions and report green on dependencies that were
        # never committed, so the drift it should surface becomes invisible.
        run: bun install --frozen-lockfile
      # Same reasoning as the Rust lane: Install is setup, so a failure there
      # makes this impossible rather than skipped. But Typecheck is a CHECK, and
      # the Test step below must not lose its answer to a type error.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck
      # Same reasoning as the Rust leg: a typecheck failure must not decide
      # whether the tests get to report.
      - name: Test
        if: ${{ !cancelled() }}
        run: bun test

      # THE LIVE SUITE IS THE ONLY CROSS-LANGUAGE PROOF AND IT HAD NEVER RUN HERE.
      #
      # Three files in clients/subc-client/tests boot a real ck-subc daemon over
      # loopback and complete the HMAC handshake, which is the one check that
      # catches a drift in proof construction, framing, or envelope layout
      # between the Rust and TypeScript implementations. Every block sits behind
      # `describe.skipIf(!LIVE)` gated on RUN_SUBC_LIVE, and NO WORKFLOW SET IT --
      # so a divergence would have shipped green. The committed wire vectors and
      # the golden-conformance suite pin BYTES; only this pins a live handshake.
      #
      # It ran nowhere for a half-true reason, which is why it survived review:
      # the suite is off by default so the unit lane can stay bun-only, and this
      # job genuinely had no Rust toolchain. True, and it explains the DEFAULT
      # rather than the absence -- nobody had added the toolchain to the one job
      # that runs bun. A justification that answers a neighbouring question is
      # stickier than a false one, because checking it returns a real reason and
      # the reader stops.
      #
      # Restricted to the subc-client leg: the store and log packages have no
      # daemon tests, so building a daemon there would be pure cost.
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !cancelled() && matrix.pkg == 'subc-client' }}
      # tests/live-daemon.ts builds the daemon itself when target/debug/ck-subc is
      # missing, so this step is not what makes the suite work -- it moves the
      # build OUT of the first test, where a cold compile would run against bun's
      # per-test timeout and fail as a daemon defect rather than a slow build.
      # Path and target must stay in step with DAEMON in that helper.
      - name: Pre-build ck-subc for the live suite
        if: ${{ !cancelled() && matrix.pkg == 'subc-client' }}
        working-directory: .
        run: cargo build --locked -p subc-core --bin ck-subc
      # RUN_SUBC_LIVE only OPENS the gate; it cannot prove the blocks executed.
      # A skipped describe and a passing one both report success, so the step
      # asserts the live tests actually ran -- see the guard in the run body.
      - name: Live daemon suite
        if: ${{ !cancelled() && matrix.pkg == 'subc-client' }}
        env:
          RUN_SUBC_LIVE: "1"
        run: |
          set -o pipefail
          bun test tests/live-handshake.test.ts tests/live-provider.test.ts \
            tests/live-streaming.test.ts 2>&1 | tee /tmp/live.log
          # FAIL LOUDLY ON A VACUOUS PASS. With the gate shut every block is
          # skipped and bun still exits 0 -- which is exactly the state this job
          # was in before today, reporting green while proving nothing.
          #
          # Measured both outputs rather than assuming the shape: skipped prints
          # "4 skip" and NO pass line at all; a real run prints "2 pass". So a
          # guard looking for the literal "0 pass" could never fire -- it was my
          # first version, and the closed-gate control is what caught it. Reading
          # the count and defaulting an ABSENT line to zero covers both.
          passed=$(sed -nE 's/^[[:space:]]*([0-9]+) pass.*/\1/p' /tmp/live.log | head -1)
          if [ "${passed:-0}" -eq 0 ]; then
            echo "live suite executed no tests -- RUN_SUBC_LIVE did not open the gate"
            exit 1
          fi
          echo "live suite executed ${passed} tests against a real daemon"
