name: Publish wire crates on bump

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: publish-wire-crates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect unpublished wire crates
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      protocol_version: ${{ steps.versions.outputs.protocol_version }}
      transport_version: ${{ steps.versions.outputs.transport_version }}
      control_version: ${{ steps.versions.outputs.control_version }}
      client_version: ${{ steps.versions.outputs.client_version }}
      jsonc_version: ${{ steps.versions.outputs.jsonc_version }}
      cgroup_version: ${{ steps.versions.outputs.cgroup_version }}
      uptime_version: ${{ steps.versions.outputs.uptime_version }}
      os_version: ${{ steps.versions.outputs.os_version }}
      daemon_version: ${{ steps.versions.outputs.daemon_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Publish the commit CI proved green, never a newer branch tip.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect versions absent from crates.io
        id: versions
        run: |
          unpublished=$(bash scripts/release/unpublished-wire-crates.sh)
          if [ -n "$unpublished" ]; then
            printf '%s\n' "$unpublished"
          else
            echo "All wire crates are already published"
          fi
          find_version() {
            awk -v crate="$1" '$1 == crate { print $2 }' <<<"$unpublished"
          }
          {
            echo "protocol_version=$(find_version subc-protocol)"
            echo "transport_version=$(find_version subc-transport)"
            echo "control_version=$(find_version subc-control)"
            echo "client_version=$(find_version subc-client-rs)"
            echo "jsonc_version=$(find_version subc-jsonc)"
            echo "cgroup_version=$(find_version subc-cgroup)"
            echo "uptime_version=$(find_version subc-uptime)"
            echo "os_version=$(find_version subc-os)"
            echo "daemon_version=$(find_version subc-daemon)"
          } >> "$GITHUB_OUTPUT"

  publish_protocol:
    name: Publish subc-protocol
    needs: detect
    if: ${{ needs.detect.outputs.protocol_version != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    with:
      crate: subc-protocol
      version: ${{ needs.detect.outputs.protocol_version }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish_transport:
    name: Publish subc-transport
    needs: [detect, publish_protocol]
    if: >-
      ${{
        always() &&
        needs.detect.result == 'success' &&
        (needs.publish_protocol.result == 'success' || needs.publish_protocol.result == 'skipped') &&
        needs.detect.outputs.transport_version != ''
      }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    with:
      crate: subc-transport
      version: ${{ needs.detect.outputs.transport_version }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish_control:
    name: Publish subc-control
    needs: [detect, publish_protocol, publish_transport]
    if: >-
      ${{
        always() &&
        needs.detect.result == 'success' &&
        (needs.publish_protocol.result == 'success' || needs.publish_protocol.result == 'skipped') &&
        (needs.publish_transport.result == 'success' || needs.publish_transport.result == 'skipped') &&
        needs.detect.outputs.control_version != ''
      }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    with:
      crate: subc-control
      version: ${{ needs.detect.outputs.control_version }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish_client:
    name: Publish subc-client-rs
    needs: [detect, publish_protocol, publish_transport, publish_control]
    if: >-
      ${{
        always() &&
        needs.detect.result == 'success' &&
        (needs.publish_protocol.result == 'success' || needs.publish_protocol.result == 'skipped') &&
        (needs.publish_transport.result == 'success' || needs.publish_transport.result == 'skipped') &&
        (needs.publish_control.result == 'success' || needs.publish_control.result == 'skipped') &&
        needs.detect.outputs.client_version != ''
      }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    with:
      crate: subc-client-rs
      version: ${{ needs.detect.outputs.client_version }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish_jsonc:
    name: Publish subc-jsonc
    needs: detect
    if: ${{ needs.detect.outputs.jsonc_version != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    with:
      crate: subc-jsonc
      version: ${{ needs.detect.outputs.jsonc_version }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish_cgroup:
    name: Publish subc-cgroup
    needs: detect
    if: ${{ needs.detect.outputs.cgroup_version != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    with:
      crate: subc-cgroup
      version: ${{ needs.detect.outputs.cgroup_version }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish_uptime:
    name: Publish subc-uptime
    needs: detect
    if: ${{ needs.detect.outputs.uptime_version != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    with:
      crate: subc-uptime
      version: ${{ needs.detect.outputs.uptime_version }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish_os:
    name: Publish subc-os
    needs: detect
    if: ${{ needs.detect.outputs.os_version != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    with:
      crate: subc-os
      version: ${{ needs.detect.outputs.os_version }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # The daemon depends on every crate above except subc-client-rs, so it runs
  # only after each of them either published or had nothing to publish.
  publish_daemon:
    name: Publish subc-daemon
    needs: [detect, publish_protocol, publish_transport, publish_control, publish_jsonc, publish_cgroup, publish_uptime, publish_os]
    if: >-
      ${{
        always() &&
        needs.detect.result == 'success' &&
        (needs.publish_protocol.result == 'success' || needs.publish_protocol.result == 'skipped') &&
        (needs.publish_transport.result == 'success' || needs.publish_transport.result == 'skipped') &&
        (needs.publish_control.result == 'success' || needs.publish_control.result == 'skipped') &&
        (needs.publish_jsonc.result == 'success' || needs.publish_jsonc.result == 'skipped') &&
        (needs.publish_cgroup.result == 'success' || needs.publish_cgroup.result == 'skipped') &&
        (needs.publish_uptime.result == 'success' || needs.publish_uptime.result == 'skipped') &&
        (needs.publish_os.result == 'success' || needs.publish_os.result == 'skipped') &&
        needs.detect.outputs.daemon_version != ''
      }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    with:
      crate: subc-daemon
      version: ${{ needs.detect.outputs.daemon_version }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
