name: Release npm

# Publishes the monorepo's npm packages via OIDC TRUSTED PUBLISHING — no
# NPM_TOKEN, no manual passkey. Authentication is a short-lived GitHub OIDC
# token exchanged with npm, scoped to this repo + this workflow file. One-time
# npm-side setup is required PER PACKAGE (see docs/npm-trusted-publishing.md):
# configure the package's Trusted Publisher on npmjs.com to point at this repo
# + this workflow filename.
#
# Tag format: `<pkg>@<version>` (npm-style, e.g. subc-client@0.2.1, store@0.1.0).
# Deliberately NOT `<name>-v<version>` so it never triggers release.yml (crates),
# which matches `*-v*` and would fail on a non-existent crate of that name.
on:
  push:
    tags:
      - "subc-client@*"
      - "store@*"
      - "log@*"
      - "private-files@*"

concurrency:
  group: release-npm-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # REQUIRED: lets the job mint the GitHub OIDC token npm verifies.

jobs:
  private-files-prebuilds:
    name: Native N-API v8 prebuild (${{ matrix.arch }})
    if: startsWith(github.ref_name, 'private-files@')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      - name: Build with MSVC and record toolchain/runtime
        shell: pwsh
        working-directory: clients/private-files
        run: |
          node --version
          node -p 'JSON.stringify(process.versions)'
          ./native/build.ps1 -Arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-files-prebuild-${{ matrix.arch }}
          path: clients/private-files/prebuilds/*.node
          if-no-files-found: error
      - name: Upload PE import inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-files-build-${{ matrix.arch }}
          path: clients/private-files/private-files-evidence/imports-*.txt
          if-no-files-found: error

  publish:
    name: Publish npm package
    needs: private-files-prebuilds
    # Other npm tags skip the native job and retain their existing publish path.
    if: ${{ !cancelled() && (needs.private-files-prebuilds.result == 'success' || needs.private-files-prebuilds.result == 'skipped') }}
    # Blacksmith runner (private repo on the free plan blocks GitHub-hosted
    # Actions). Blacksmith is a drop-in that honors GitHub-native OIDC, so
    # trusted publishing works unchanged as long as id-token: write is granted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Map the tag prefix to the package directory. Adding a package = add a
      # tag pattern above + a case arm here + the one-time npm Trusted Publisher.
      - name: Resolve package dir from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="${TAG%@*}"
          case "$PKG" in
            subc-client) DIR="clients/subc-client" ;;
            store)       DIR="clients/store" ;;
            log)         DIR="clients/log" ;;
            private-files) DIR="clients/private-files" ;;
            *) echo "::error::No package mapping for tag prefix '$PKG'"; exit 1 ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#*@}" >> "$GITHUB_OUTPUT"
          echo "Publishing from $DIR (tag $TAG)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10.x.
      # Pinned to the npm 11 line: npm 12 raised its node floor past what
      # setup-node's "22" resolves to, so @latest can break the release out
      # from under us on an npm major.
      - name: Upgrade npm to a trusted-publishing-capable version
        run: npm install -g npm@11

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Store and log use the locked sibling private-files package before its first publish.
      - name: Build sibling private-files for store and log
        if: ${{ steps.pkg.outputs.dir == 'clients/store' || steps.pkg.outputs.dir == 'clients/log' }}
        working-directory: clients/private-files
        run: bun install --frozen-lockfile && bun run build

      # Log's locked local dependency exports compiled files. Build them before
      # installing log so verification and prepack work on a fresh checkout.
      - name: Build sibling store for log
        if: ${{ steps.pkg.outputs.dir == 'clients/log' }}
        working-directory: clients/store
        run: bun install --frozen-lockfile && bun run build

      # Gate the publish on the same checks a PR runs — a release can never ship
      # code that would not pass CI.
      - name: Install dev deps + verify
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          # No fallback: --frozen-lockfile fails exactly when the committed lock
          # disagrees with package.json, and that is the one condition a RELEASE
          # must refuse. Falling back to a plain install would resolve fresh
          # versions, rewrite the lock inside the runner, verify against those
          # unreviewed versions and publish the result -- so the artifact ships
          # dependencies nobody approved while every step reports success.
          bun install --frozen-lockfile
          bun run typecheck
          bun test

      - name: Assemble Windows prebuilds
        if: ${{ steps.pkg.outputs.dir == 'clients/private-files' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: private-files-prebuild-*
          path: clients/private-files/prebuilds/
          merge-multiple: true

      - name: Check Windows prebuild architectures and delayed host imports
        if: ${{ steps.pkg.outputs.dir == 'clients/private-files' }}
        working-directory: clients/private-files
        run: node scripts/check-prebuilds.mjs

      # Guard: the tag version must match package.json, so a stale or mistyped
      # tag can't publish the wrong version (mirrors the crate release guard).
      - name: Assert tag matches package.json version
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          TAG_VERSION="${{ steps.pkg.outputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag wants ${TAG_VERSION} but package.json has ${PKG_VERSION}"
            exit 1
          fi
          echo "Publishing ${PKG_VERSION}"

      # Idempotent: a retag of an already-published version (recovery re-run) is
      # treated as success rather than failing the release.
      #
      # Provenance is DISABLED: sigstore provenance attestation is only accepted
      # from github-hosted runners, and this repo is forced onto Blacksmith
      # (self-hosted class) because the free-plan org blocks private-repo
      # GitHub-hosted Actions. OIDC trusted-publishing AUTH itself works on
      # Blacksmith; only the provenance bundle is rejected (E422). npm >= 11.5.1
      # auto-enables provenance under trusted publishing, so we override it off
      # explicitly via NPM_CONFIG_PROVENANCE.
      - name: Publish (OIDC trusted publishing)
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          out=$(npm publish --access public 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          if echo "$out" | grep -qi "cannot publish over\|previously published\|You cannot publish over"; then
            echo "already published; treating as success"; exit 0
          fi
          exit 1
