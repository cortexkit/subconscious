name: Release npm

# Publishes the monorepo's npm packages via OIDC TRUSTED PUBLISHING — no
# NPM_TOKEN, no manual passkey. Authentication is a short-lived GitHub OIDC
# token exchanged with npm, scoped to this repo + this workflow file. One-time
# npm-side setup is required PER PACKAGE (see docs/npm-trusted-publishing.md):
# configure the package's Trusted Publisher on npmjs.com to point at this repo
# + this workflow filename.
#
# Tag format: `<pkg>@<version>` (npm-style, e.g. subc-client@0.2.1, store@0.1.0).
# Deliberately NOT `<name>-v<version>` so it never triggers release.yml (crates),
# which matches `*-v*` and would fail on a non-existent crate of that name.
on:
  push:
    branches:
      - "train/**"
    tags:
      - "subc-client@*"
      - "store@*"
      - "log@*"
      - "private-files@*"
    paths:
      - "clients/subc-client/**"
      - "clients/subc-registration-native/**"
      - "crates/subc-os/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-npm.yml"
  pull_request:
    paths:
      - "clients/subc-client/**"
      - "clients/subc-registration-native/**"
      - "crates/subc-os/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-npm.yml"

concurrency:
  group: release-npm-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  subc-client-prebuilds:
    name: Registration N-API v8 prebuild (${{ matrix.platform }}-${{ matrix.arch }})
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/train/') || startsWith(github.ref, 'refs/tags/subc-client@')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            library: libsubc_registration_native.so
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            library: libsubc_registration_native.so
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin
            arch: x64
            library: libsubc_registration_native.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
            library: libsubc_registration_native.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
            library: subc_registration_native.dll
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: win32
            arch: arm64
            library: subc_registration_native.dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build registration helper
        run: cargo build --locked --release -p subc-registration-native --target ${{ matrix.target }}
      # Every artifact carries the same loader, declarations and CommonJS package
      # scope; merging them leaves six distinct binaries beside that loader.
      - name: Stage bundle-local native package
        shell: bash
        run: |
          mkdir -p clients/subc-client/native
          cp clients/subc-registration-native/{index.js,index.d.ts,package.json} clients/subc-client/native/
          cp "target/${{ matrix.target }}/release/${{ matrix.library }}" \
            "clients/subc-client/native/subc-registration-${{ matrix.platform }}-${{ matrix.arch }}.node"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: subc-client-prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: clients/subc-client/native/
          if-no-files-found: error

  subc-client-bundle-check:
    name: Check SDK native release bundle (${{ matrix.os }}, no publish)
    needs: subc-client-prebuilds
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/train/') || startsWith(github.ref, 'refs/tags/subc-client@')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Assemble registration prebuilds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: subc-client-prebuild-*
          path: clients/subc-client/native/
          merge-multiple: true
      - name: Install SDK dev dependencies
        working-directory: clients/subc-client
        run: bun install --frozen-lockfile
      - name: Check publishable SDK bundle
        if: matrix.os == 'ubuntu-latest'
        working-directory: clients/subc-client
        run: bun run prepublishOnly
      - name: Check compiled registration helper
        working-directory: clients/subc-client
        run: bun test tests/registration-compiled.test.ts

  private-files-prebuilds:
    name: Native N-API v8 prebuild (${{ matrix.arch }})
    if: startsWith(github.ref_name, 'private-files@')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      - name: Build with MSVC and record toolchain/runtime
        shell: pwsh
        working-directory: clients/private-files
        run: |
          node --version
          node -p 'JSON.stringify(process.versions)'
          ./native/build.ps1 -Arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-files-prebuild-${{ matrix.arch }}
          path: clients/private-files/prebuilds/*.node
          if-no-files-found: error
      - name: Upload PE import inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-files-build-${{ matrix.arch }}
          path: clients/private-files/private-files-evidence/imports-*.txt
          if-no-files-found: error

  publish:
    name: Publish npm package
    needs: [private-files-prebuilds, subc-client-prebuilds, subc-client-bundle-check]
    # PRs and branch pushes only check the SDK bundle. Publishing stays tag-only,
    # and a failed native build must not be treated like an unrelated skipped lane.
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && (needs.private-files-prebuilds.result == 'success' || needs.private-files-prebuilds.result == 'skipped') && (needs.subc-client-prebuilds.result == 'success' || needs.subc-client-prebuilds.result == 'skipped') && (needs.subc-client-bundle-check.result == 'success' || needs.subc-client-bundle-check.result == 'skipped') }}
    permissions:
      contents: read
      id-token: write # Required for npm OIDC trusted publishing, never for PR checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Map the tag prefix to the package directory. Adding a package = add a
      # tag pattern above + a case arm here + the one-time npm Trusted Publisher.
      - name: Resolve package dir from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="${TAG%@*}"
          case "$PKG" in
            subc-client) DIR="clients/subc-client" ;;
            store)       DIR="clients/store" ;;
            log)         DIR="clients/log" ;;
            private-files) DIR="clients/private-files" ;;
            *) echo "::error::No package mapping for tag prefix '$PKG'"; exit 1 ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#*@}" >> "$GITHUB_OUTPUT"
          echo "Publishing from $DIR (tag $TAG)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10.x.
      # Pinned to the npm 11 line: npm 12 raised its node floor past what
      # setup-node's "22" resolves to, so @latest can break the release out
      # from under us on an npm major.
      - name: Upgrade npm to a trusted-publishing-capable version
        run: npm install -g npm@11

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Assemble registration prebuilds
        if: ${{ steps.pkg.outputs.dir == 'clients/subc-client' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: subc-client-prebuild-*
          path: clients/subc-client/native/
          merge-multiple: true

      # Store and log use the locked sibling private-files package before its first publish.
      - name: Build sibling private-files for store and log
        if: ${{ steps.pkg.outputs.dir == 'clients/store' || steps.pkg.outputs.dir == 'clients/log' }}
        working-directory: clients/private-files
        run: bun install --frozen-lockfile && bun run build

      # Log's locked local dependency exports compiled files. Build them before
      # installing log so verification and prepack work on a fresh checkout.
      - name: Build sibling store for log
        if: ${{ steps.pkg.outputs.dir == 'clients/log' }}
        working-directory: clients/store
        run: bun install --frozen-lockfile && bun run build

      # Gate the publish on the same checks a PR runs — a release can never ship
      # code that would not pass CI.
      - name: Install dev deps + verify
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          # No fallback: --frozen-lockfile fails exactly when the committed lock
          # disagrees with package.json, and that is the one condition a RELEASE
          # must refuse. Falling back to a plain install would resolve fresh
          # versions, rewrite the lock inside the runner, verify against those
          # unreviewed versions and publish the result -- so the artifact ships
          # dependencies nobody approved while every step reports success.
          bun install --frozen-lockfile
          bun run typecheck
          bun test

      - name: Assemble Windows prebuilds
        if: ${{ steps.pkg.outputs.dir == 'clients/private-files' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: private-files-prebuild-*
          path: clients/private-files/prebuilds/
          merge-multiple: true

      - name: Check Windows prebuild architectures and delayed host imports
        if: ${{ steps.pkg.outputs.dir == 'clients/private-files' }}
        working-directory: clients/private-files
        run: node scripts/check-prebuilds.mjs

      - name: Check publishable SDK bundle
        if: ${{ steps.pkg.outputs.dir == 'clients/subc-client' }}
        working-directory: clients/subc-client
        run: bun run prepublishOnly

      # Guard: the tag version must match package.json, so a stale or mistyped
      # tag can't publish the wrong version (mirrors the crate release guard).
      - name: Assert tag matches package.json version
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          TAG_VERSION="${{ steps.pkg.outputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag wants ${TAG_VERSION} but package.json has ${PKG_VERSION}"
            exit 1
          fi
          echo "Publishing ${PKG_VERSION}"

      # Idempotent: a retag of an already-published version (recovery re-run) is
      # treated as success rather than failing the release.
      #
      # Keep the existing provenance policy: npm >= 11.5.1 auto-enables it
      # under trusted publishing unless NPM_CONFIG_PROVENANCE overrides it.
      - name: Publish (OIDC trusted publishing)
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          out=$(npm publish --access public 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          if echo "$out" | grep -qi "cannot publish over\|previously published\|You cannot publish over"; then
            echo "already published; treating as success"; exit 0
          fi
          exit 1
