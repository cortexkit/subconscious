name: Release

# Per-crate release. Tag format: `<crate>-v<version>` (for example,
# `subc-transport-v0.1.0`). `subc-core` is publish=false: its tags publish the
# installable subconscious archives below rather than a crates.io package.
on:
  push:
    tags:
      - "*-v*"

concurrency:
  # A retag at a different commit must not wait behind a stale release run.
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Use the same verification matrix as pull requests before publishing any
  # release asset.
  verify:
    uses: ./.github/workflows/ci.yml

  create-subconscious-release:
    name: Create subconscious release
    if: startsWith(github.ref_name, 'subc-core-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag version and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#subc-core-v}"
          CARGO_VERSION=$(grep '^version' crates/subc-core/Cargo.toml | head -1 | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag wants ${VERSION} but crates/subc-core/Cargo.toml has ${CARGO_VERSION}"
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release ${TAG} already exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "Subconscious alpha archives: ck, ck-subc, and ck-subc-mcp."
          fi

  linux-binaries:
    name: Subconscious archives (linux-x64)
    if: startsWith(github.ref_name, 'subc-core-v')
    needs: create-subconscious-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release --locked -p subc-core -p subc-mcp --bin ck --bin ck-subc --bin ck-subc-mcp

      - name: Package convention-named archives and digest sidecars
        run: bash scripts/release/package-unix-archives.sh linux x64 target/release dist

      - name: Upload release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  windows-binaries:
    name: Subconscious archives (windows-x64)
    if: startsWith(github.ref_name, 'subc-core-v')
    needs: create-subconscious-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release --locked -p subc-core -p subc-mcp --bin ck --bin ck-subc --bin ck-subc-mcp

      # Alpha deliberately ships these native Windows binaries unsigned. This is
      # an accepted alpha limitation, not a fallback to a development certificate.
      - name: Package unsigned convention-named archives and digest sidecars
        shell: pwsh
        run: ./scripts/release/package-windows-archives.ps1 -SourceDirectory target/release -DistDirectory dist

      - name: Upload release archives
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" dist/* --repo "$env:GITHUB_REPOSITORY" --clobber

  macos-binaries:
    name: Signed and notarized subconscious archives (darwin-arm64)
    if: startsWith(github.ref_name, 'subc-core-v')
    needs: create-subconscious-release
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release --locked -p subc-core -p subc-mcp --bin ck --bin ck-subc --bin ck-subc-mcp

      # Alpha arm, explicit by repository variable: package adhoc-signed archives
      # when the Developer ID secrets are not provisioned in this repo. The
      # Developer ID identity currently lives only in magic-context's CI; signed
      # and notarized replacements are produced through its sign-notarize
      # dispatch workflow and re-uploaded over these assets. This arm never
      # engages silently: it requires ALPHA_DARWIN_UNSIGNED=true and stamps the
      # asset provenance into the release notes.
      - name: Package adhoc-signed archives (declared alpha arm)
        if: vars.ALPHA_DARWIN_UNSIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          for bin in ck ck-subc ck-subc-mcp; do
            codesign --force --sign - --identifier "$bin" "target/release/$bin"
            (cd target/release && zip -q -X "../../dist/$bin-darwin-arm64.zip" "$bin")
            # shasum output format (hex, two spaces, filename) per the sidecar
            # grammar; bare hex breaks `shasum -c` consumers.
            (cd dist && shasum -a 256 "$bin-darwin-arm64.zip" > "$bin-darwin-arm64.zip.sha256")
          done
          ls -la dist/
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --notes "Subconscious alpha archives: ck, ck-subc, and ck-subc-mcp. darwin-arm64 assets are adhoc-signed pending notarized replacements via the signing dispatch."

      - name: Import Developer ID Application certificate
        if: vars.ALPHA_DARWIN_UNSIGNED != 'true'
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64" ]; then
            echo "::error::Developer ID Application certificate secret is required"
            exit 1
          fi
          if [ -z "$DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD" ]; then
            echo "::error::Developer ID Application certificate password secret is required"
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/developer-id-application.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          export CERTIFICATE_PATH DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(
              base64.b64decode(os.environ["DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64"])
          )
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD" -A
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Write App Store Connect API key
        if: vars.ALPHA_DARWIN_UNSIGNED != 'true'
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY" ] || [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_API_ISSUER_ID" ]; then
            echo "::error::App Store Connect API-key credentials are required for notarization"
            exit 1
          fi
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Sign, notarize, and package macOS archives
        if: vars.ALPHA_DARWIN_UNSIGNED != 'true'
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: bash scripts/release/macos-sign-notarize.sh target/release dist

      - name: Upload release archives
        if: vars.ALPHA_DARWIN_UNSIGNED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  # ck-aft is intentionally absent: its publication is a named cross-repository
  # dependency owned by the AFT repository's release lane.
  publish:
    name: Publish to crates.io
    # subc-core tags cut binary releases (above), never a crates.io publish.
    if: ${{ !startsWith(github.ref_name, 'subc-core-v') }}
    # Blacksmith runner (not GitHub-hosted): the owning org is on the free plan,
    # where GitHub blocks private-repo Actions jobs at the zero spending limit.
    # See ci.yml for the full rationale.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Parse `<crate>-v<version>` from the tag and assert the crate's
      # Cargo.toml version matches — guards against tagging a stale version.
      - name: Resolve crate + version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^(.+)-v([0-9].*)$ ]]; then
            echo "::error::Tag '$TAG' must be '<crate>-v<version>', e.g. subc-transport-v0.1.0"
            exit 1
          fi
          CRATE="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"
          MANIFEST="crates/${CRATE}/Cargo.toml"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::No crate '${CRATE}' at ${MANIFEST}"
            exit 1
          fi
          CARGO_VERSION=$(grep '^version' "$MANIFEST" | head -1 | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag wants ${VERSION} but ${MANIFEST} has ${CARGO_VERSION}"
            exit 1
          fi
          echo "crate=$CRATE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing ${CRATE} v${VERSION}"

      # Idempotent: a retag of the same version (recovery re-run) treats
      # "already exists" as success instead of failing the release.
      #
      # Paired-release race: subc-transport depends on subc-protocol, so when both
      # tags are pushed together, transport's publish can run before the freshly
      # published protocol version is resolvable on the index ("failed to select a
      # version for the requirement"). That is transient index propagation, not a
      # real failure — retry with a delay before giving up.
      - name: Publish
        run: |
          CRATE="${{ steps.tag.outputs.crate }}"
          for attempt in 1 2 3 4 5 6; do
            out=$(cargo publish --package "$CRATE" 2>&1) && { echo "$out"; exit 0; }
            echo "$out"
            if echo "$out" | grep -q "already exists"; then
              echo "already published; treating as success"; exit 0
            fi
            if echo "$out" | grep -q "failed to select a version for the requirement"; then
              echo "dependency not yet resolvable on the index (attempt $attempt); retrying in 60s"
              sleep 60; continue
            fi
            exit 1
          done
          echo "::error::dependency still unresolvable after retries"
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
