name: Release

# Per-crate release. Tag format: `<crate>-v<version>` (e.g. subc-transport-v0.1.0).
# Each PUBLISHABLE crate (subc-protocol, subc-transport) versions and publishes
# independently — they are leaf crates with no inter-crate publish-order
# dependency. subc-core is publish=false (the daemon, never published to
# crates.io) — its release lane instead uploads BINARY artifacts (ck-subc,
# subc-probe, ck, fake-aft-stub, ck-subc-mcp) to a GitHub release so sibling repos'
# CI (e.g. AFT's subc e2e lane) can fetch a pinned daemon without a source
# checkout. Tag `subc-core-v<version>` to cut one.
on:
  push:
    tags:
      - "*-v*"

concurrency:
  # Include SHA so a retag at a different commit gets its own group and won't
  # block behind a stuck queued run.
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same fmt/clippy/test matrix as PR-time CI. Reused (not copied) so a release
  # can never ship code that wouldn't pass CI — including the cross-platform
  # transport tests.
  verify:
    uses: ./.github/workflows/ci.yml

  # Daemon binary artifacts for sibling-repo CI. Runs only for subc-core tags;
  # the crates.io publish job below skips those (subc-core is publish=false).
  binaries:
    name: Binary artifacts (${{ matrix.target.name }})
    if: startsWith(github.ref_name, 'subc-core-v')
    needs: verify
    permissions:
      contents: write
    # linux-x64 only in CI: Blacksmith has no macOS runners and GitHub-hosted
    # macOS is billing-blocked for this free-plan private org (see ci.yml).
    # darwin-arm64 assets are built + uploaded from the dev box by
    # scripts/release-darwin-binaries.sh against the same tag.
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x64
            # 22.04 deliberately: the binary's glibc floor is set by the BUILD
            # image (24.04 produced GLIBC_2.39-requiring assets that failed on
            # GitHub's default ubuntu-22.04 runners, glibc 2.35). Consumers run
            # these binaries on arbitrary CI images; keep the floor low.
            runner: ubuntu-latest
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Version-match guard
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#subc-core-v}"
          CARGO_VERSION=$(grep '^version' crates/subc-core/Cargo.toml | head -1 | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag wants ${VERSION} but crates/subc-core/Cargo.toml has ${CARGO_VERSION}"
            exit 1
          fi

      - name: Build release binaries
        run: cargo build --release --locked -p subc-core -p subc-mcp --bin ck-subc --bin subc-probe --bin ck --bin fake-aft-stub --bin ck-subc-mcp

      # Asset naming: <bin>-<target>.tar.gz containing the bare binary, plus a
      # .sha256 sidecar per asset — consumers pin the tag and verify the digest.
      - name: Package + checksum
        run: |
          mkdir -p dist
          for bin in ck-subc subc-probe ck fake-aft-stub ck-subc-mcp; do
            tar -C target/release -czf "dist/${bin}-${{ matrix.target.name }}.tar.gz" "$bin"
            shasum -a 256 "dist/${bin}-${{ matrix.target.name }}.tar.gz" | awk '{print $1}' > "dist/${bin}-${{ matrix.target.name }}.tar.gz.sha256"
          done
          ls -la dist/

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release if it does not exist yet. A retag or recovery
          # re-run finds it already present, which is success. Anything else --
          # a permissions problem, a network failure, a malformed tag -- is a
          # real failure and must reach the log. Discarding it makes the upload
          # below fail with "release not found", which sends the reader after a
          # missing release instead of the cause that actually stopped it.
          #
          # The benign case is distinguished by asking whether the release now
          # EXISTS, not by matching text in the failure. Error wording is not a
          # contract -- gh has rendered this as both "already exists" and
          # "already_exists" -- and a pattern that stops matching sends a
          # successful retag down the failure path. The state query cannot drift.
          if ! out=$(gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
                --title "${GITHUB_REF_NAME}" \
                --notes "subc daemon binaries for sibling-repo CI (ck-subc, subc-probe, ck, fake-aft-stub, ck-subc-mcp)." 2>&1); then
            if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "release ${GITHUB_REF_NAME} already exists; uploading into it"
            else
              echo "::error::gh release create failed and no such release exists: ${out}"
              exit 1
            fi
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber

  publish:
    name: Publish to crates.io
    # subc-core tags cut binary releases (above), never a crates.io publish.
    if: ${{ !startsWith(github.ref_name, 'subc-core-v') }}
    # Blacksmith runner (not GitHub-hosted): the owning org is on the free plan,
    # where GitHub blocks private-repo Actions jobs at the zero spending limit.
    # See ci.yml for the full rationale.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Parse `<crate>-v<version>` from the tag and assert the crate's
      # Cargo.toml version matches — guards against tagging a stale version.
      - name: Resolve crate + version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^(.+)-v([0-9].*)$ ]]; then
            echo "::error::Tag '$TAG' must be '<crate>-v<version>', e.g. subc-transport-v0.1.0"
            exit 1
          fi
          CRATE="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"
          MANIFEST="crates/${CRATE}/Cargo.toml"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::No crate '${CRATE}' at ${MANIFEST}"
            exit 1
          fi
          CARGO_VERSION=$(grep '^version' "$MANIFEST" | head -1 | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag wants ${VERSION} but ${MANIFEST} has ${CARGO_VERSION}"
            exit 1
          fi
          echo "crate=$CRATE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing ${CRATE} v${VERSION}"

      # Idempotent: a retag of the same version (recovery re-run) treats
      # "already exists" as success instead of failing the release.
      #
      # Paired-release race: subc-transport depends on subc-protocol, so when both
      # tags are pushed together, transport's publish can run before the freshly
      # published protocol version is resolvable on the index ("failed to select a
      # version for the requirement"). That is transient index propagation, not a
      # real failure — retry with a delay before giving up.
      - name: Publish
        run: |
          CRATE="${{ steps.tag.outputs.crate }}"
          for attempt in 1 2 3 4 5 6; do
            out=$(cargo publish --package "$CRATE" 2>&1) && { echo "$out"; exit 0; }
            echo "$out"
            if echo "$out" | grep -q "already exists"; then
              echo "already published; treating as success"; exit 0
            fi
            if echo "$out" | grep -q "failed to select a version for the requirement"; then
              echo "dependency not yet resolvable on the index (attempt $attempt); retrying in 60s"
              sleep 60; continue
            fi
            exit 1
          done
          echo "::error::dependency still unresolvable after retries"
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
