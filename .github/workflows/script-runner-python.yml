name: Script runner (Python)

on:
  push:
    branches: [master, "train/**"]
    paths: ["clients/script-runner-python/**", "clients/script-runner/tests/pipe-launcher.py", "clients/script-runner/tests/script-pipe-vector.json", "scripts/release/build-script-runner-python*.sh", "scripts/release/check-glibc.sh", "scripts/release/test-check-glibc.sh", "scripts/release/macos-sign-notarize.sh", ".github/workflows/script-runner-python.yml", ".github/workflows/release.yml"]
  pull_request:
    paths: ["clients/script-runner-python/**", "clients/script-runner/tests/pipe-launcher.py", "clients/script-runner/tests/script-pipe-vector.json", "scripts/release/build-script-runner-python*.sh", "scripts/release/check-glibc.sh", "scripts/release/test-check-glibc.sh", "scripts/release/macos-sign-notarize.sh", ".github/workflows/script-runner-python.yml", ".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Embedded CPython (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Windows builds compile OpenSSL and CPython from source unless the cache below holds them.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu, sign: ""}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, sign: ""}
          - {os: macos-latest, target: aarch64-apple-darwin, sign: "--sign"}
          # python-build-standalone ships libpython, OpenSSL and SQLite for Windows only as
          # DLLs, so the Windows runner builds CPython statically from the sources in
          # windows-sources.lock (tools/build_windows_cpython.py).
          - {os: windows-latest, target: x86_64-pc-windows-msvc, sign: ""}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc, sign: ""}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache the pinned CPython archive or Windows sources
        uses: actions/cache@v4
        with:
          path: |
            target/python-dist/archives/${{ matrix.target }}.tar.zst
            target/python-dist/windows-sources
            target/python-build/${{ matrix.target }}-openssl
          key: python-inputs-${{ matrix.target }}-${{ hashFiles('clients/script-runner-python/python-archives.lock', 'clients/script-runner-python/windows-sources.lock') }}
      - name: Build and test (on macOS also sign ad hoc and run the signed binary)
        if: runner.os != 'Linux'
        shell: bash
        env:
          DEVELOPER_ID_APPLICATION_IDENTITY: "-"
        run: bash scripts/release/build-script-runner-python.sh ${{ matrix.target }} ${{ matrix.sign }} --test
      - name: Build and test in the release glibc 2.28 environment
        if: runner.os == 'Linux'
        run: bash scripts/release/build-script-runner-python-linux.sh ${{ matrix.target }} --test
      - name: Check the Python runner's glibc ceiling and the checker fixtures
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/release/test-check-glibc.sh
          # The shared checker requires the complete Core set. Copies of the
          # runner stand in for the other binaries in this runner-only job.
          mkdir -p target/python-glibc-check
          for binary in ck ck-subc ck-subc-mcp ck-script-runner-bun ck-script-runner-python ck-nats-server ck-bus; do
            cp target/${{ matrix.target }}/release/ck-script-runner-python target/python-glibc-check/$binary
          done
          # Only ELF linkage is checked, so a freestanding static executable
          # stands in for the engine, which has no C dependencies, without building NATS here.
          printf 'void entry(void) {}\n' > target/python-glibc-check/static.c
          cc -static -nostdlib -Wl,-e,entry target/python-glibc-check/static.c -o target/python-glibc-check/ck-nats-engine
          bash scripts/release/check-glibc.sh target/python-glibc-check
      - name: Size
        shell: bash
        run: ls -l target/${{ matrix.target }}/release/ck-script-runner-python*
      - uses: actions/upload-artifact@v4
        with:
          name: script-runner-python-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ck-script-runner-python*
          if-no-files-found: error
