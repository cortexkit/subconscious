name: Windows Bun reconnect repro

on:
  push:
    branches: ['train/win-bun-*']

permissions:
  contents: read

jobs:
  reconnect:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Latest Bun - direct layouts, test runner, and repeated baseline
        continue-on-error: true
        run: ./clients/subc-client/scripts/win-reconnect-repro.ps1 -Label latest -OutputDirectory "$env:RUNNER_TEMP/win-bun-repro"

      # Highest 1.3 release listed at https://bun.com/blog and
      # https://github.com/oven-sh/bun/releases/tag/bun-v1.3.14.
      - uses: oven-sh/setup-bun@v2
        if: always()
        with:
          bun-version: '1.3.14'
      - name: Bun 1.3.14 - direct layouts, test runner, and repeated baseline
        if: always()
        continue-on-error: true
        run: ./clients/subc-client/scripts/win-reconnect-repro.ps1 -Label 1.3.14 -OutputDirectory "$env:RUNNER_TEMP/win-bun-repro"

      - name: Summary (native codes and signals, including forced cleanup)
        if: always()
        run: |
          $lines = @(
            '## Windows Bun reconnect experiments',
            '',
            '| Requested | Actual Bun | Mode | Result | Crashes / runs | Workload processes | Observer exit |',
            '| --- | --- | --- | --- | --- | --- | --- |'
          )
          foreach ($label in @('latest', '1.3.14')) {
            foreach ($mode in @('same-process', 'split', 'raw-same-process', 'raw-split', 'under-test', 'managed-baseline-5x')) {
              $path = "$env:RUNNER_TEMP/win-bun-repro/$label-$mode.json"
              if (Test-Path $path) {
                $result = Get-Content -Raw $path | ConvertFrom-Json
                $processes = ($result.processes | ForEach-Object {
                  $signal = if ($null -eq $_.signal) { 'none' } else { $_.signal }
                  "$($_.role): exit=$($_.exitCode), signal=$signal, forced=$($_.forced)"
                }) -join '<br>'
                $runs = if ($null -eq $result.runs) { 1 } else { $result.runs }
                $crashes = if ($null -eq $result.crashes) { [int]($result.status -eq 'crash') } else { $result.crashes }
                $lines += "| $label | $($result.bun) | $mode | $($result.status) | $crashes / $runs | $processes | $($result.observerExitCode) |"
              } else {
                $lines += "| $label | unavailable | $mode | not run / setup failed | unavailable | unavailable | unavailable |"
              }
            }
          }
          $lines += ''
          $lines += 'crash = abnormal child exit without a reported JS failure; inspect the log for Bun panic text. forced=true is observer cleanup, not an independent crash. timeout and failure are reported separately.'
          $lines += 'For bun:test rows, crashes are detected from Bun panic/segfault text or native crash exit codes; ordinary assertion failures remain separate. under-test enables WIN_BUN_REPRO=1 and requires both diagnostic tests to pass. managed-baseline-5x records five independent native exits and logs per version.'
          $lines | Tee-Object -FilePath "$env:RUNNER_TEMP/win-bun-repro-summary.md"
          $lines | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-bun-reconnect-repro
          path: |
            ${{ runner.temp }}/win-bun-repro/
            ${{ runner.temp }}/win-bun-repro-summary.md

  # The control-push test that times out on Bun 1.3.14: the real test alone and
  # in its describe, then the logged copy (scripts/win-push-timeout.test.ts) in
  # four push sequences, five fresh processes each, on both versions.
  push-timeout:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.4.3', '1.3.14']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Bun ${{ matrix.bun }} - control-push rows
        continue-on-error: true
        run: ./clients/subc-client/scripts/win-bun-subsets.ps1 -Set push -Label '${{ matrix.bun }}' -OutputDirectory "$env:RUNNER_TEMP/win-bun-push"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-bun-push-${{ matrix.bun }}
          path: ${{ runner.temp }}/win-bun-push/

  # The abnormal exits of the full managed-client suite on Bun 1.4.3, split three
  # levels deep in one job: each describe, reconnecting tests versus the rest,
  # then each reconnecting test alone. Five fresh processes per row.
  narrow-abnormal-exit:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Bun 1.4.3 - managed-client subsets
        continue-on-error: true
        run: ./clients/subc-client/scripts/win-bun-subsets.ps1 -Set narrow -Label '1.4.3' -OutputDirectory "$env:RUNNER_TEMP/win-bun-narrow"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-bun-narrow-1.4.3
          path: ${{ runner.temp }}/win-bun-narrow/

  # The two daemon-restart tests that exit abnormally alone on Bun 1.4.3: each
  # alone in its own file, then the same sequence split across a fake-daemon
  # process and a client process (scripts/win-restart-split.ts), with the
  # client as a plain script and inside bun:test. Five fresh runs per row.
  restart-split:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.4.3', '1.3.14']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Bun ${{ matrix.bun }} - daemon restart rows
        continue-on-error: true
        run: ./clients/subc-client/scripts/win-bun-subsets.ps1 -Set restart -Label '${{ matrix.bun }}' -OutputDirectory "$env:RUNNER_TEMP/win-bun-restart"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-bun-restart-${{ matrix.bun }}
          path: ${{ runner.temp }}/win-bun-restart/

  # The control-push test that fails on Bun 1.3.14, rebuilt exactly
  # (scripts/win-push-ladder.test.ts) with each difference from the logged copy
  # switched on alone and cumulatively, plus the real test and the old copy as
  # controls. Five fresh runs per row.
  push-ladder:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.3.14', '1.4.3']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Bun ${{ matrix.bun }} - control-push ladder rows
        continue-on-error: true
        run: ./clients/subc-client/scripts/win-bun-subsets.ps1 -Set ladder -Label '${{ matrix.bun }}' -OutputDirectory "$env:RUNNER_TEMP/win-bun-ladder"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-bun-ladder-${{ matrix.bun }}
          path: ${{ runner.temp }}/win-bun-ladder/
