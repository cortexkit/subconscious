[workspace]
resolver = "2"
members = [
    "crates/subc-protocol",
    "crates/subc-transport",
    "crates/subc-core",
]

# subc monorepo.
# - crates/subc-protocol : the shared wire contract (envelope + session shapes + manifest).
#   subc-OWNED (it IS subc's wire contract). Depended on by subc-core (this repo)
#   AND by AFT (sibling repo) via a path dependency:
#   in aft's Cargo.toml ->  subc-protocol = { path = "../subconscious/crates/subc-protocol" }
#   (git dependency is the CI / cross-machine upgrade when needed.)
# - crates/subc-core     : the daemon.
#
# NOTE: cortexkit-paths is NOT here — it's a product-neutral primitive living in
# the cortexkit/commons monorepo (https://github.com/cortexkit/commons) and is
# consumed from crates.io (cortexkit-paths = "0.1"), because AFT uses it without
# subc. subc-protocol stays here precisely because it is subc-defining.
