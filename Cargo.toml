[workspace]
resolver = "2"
members = [
    "crates/subc-protocol",
    "crates/subc-control",
    "crates/subc-transport",
    "crates/subc-client-rs",
    "crates/subc-jsonc",
    "crates/subc-core",
    "crates/subc-mcp",
    "crates/mcp-stdio-adapter",
    "crates/agent-token-vectors",
    "cortexkit-release",
]

# subc monorepo.
# - crates/subc-protocol : the shared module-facing wire contract
#   (envelope + module/session relay shapes + manifest + shared primitives).
#   subc-OWNED (it IS subc's wire contract). Depended on by subc-core (this repo)
#   AND by AFT (sibling repo) via a path dependency:
#   in aft's Cargo.toml ->  subc-protocol = { path = "../subconscious/crates/subc-protocol" }
#   (git dependency is the CI / cross-machine upgrade when needed.)
# - crates/subc-control  : the client-facing control wire contract.
# - crates/subc-core     : the daemon.
#
# NOTE: cortexkit-paths is NOT here — it's a product-neutral primitive living in
# the cortexkit/commons monorepo (https://github.com/cortexkit/commons) and is
# consumed from crates.io (cortexkit-paths = "0.1"), because AFT uses it without
# subc. subc-protocol and subc-control stay here precisely because they are subc-defining.

[profile.release]
# This is cargo's default, stated explicitly because the daemon's failure
# containment depends on it and nothing else records that.
#
# Every connection is served in its own task. Under unwind, a panic while
# handling one request kills that task alone: the accept loop survives, other
# connections keep being served, and the supervisor sees a healthy process.
# Under abort, the same panic takes the whole daemon down and every module
# loses its route with it.
#
# So switching this for binary size or startup time would silently convert
# every reachable panic in the tree from a single dropped request into a
# fleet-wide outage, and no test would fail. Change it only deliberately.
panic = "unwind"
