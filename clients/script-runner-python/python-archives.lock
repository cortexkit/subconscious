# python-build-standalone CPython 3.13 `full` archives that ck-script-runner-python links.
# scripts/release/build-script-runner-python.sh downloads the line for its Rust target and refuses
# the archive unless both the size and the SHA-256 match. build.rs never downloads anything.
#
# The objects in these archives are LLVM 23 bitcode (PYTHON.json `object_file_format`), so the
# final link must use an LLVM 23 lld; the build uses the rust-lld that ships with rustc.
#
# Windows has no line: its archives provide libpython, OpenSSL and SQLite only as DLLs, and the
# way to build a self-contained Windows runner is still an open decision.
#
# <rust-target> <size-bytes> <sha256> <url>
