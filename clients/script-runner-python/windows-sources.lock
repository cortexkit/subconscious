# Sources and build tools for the Windows CPython that ck-script-runner-python links.
#
# python-build-standalone ships libpython, OpenSSL and SQLite for Windows only as DLLs, so the
# Windows runner builds CPython itself, statically: tools/build_windows_cpython.py turns these
# into the same extracted layout and PYTHON.json that build.rs reads for the other platforms.
# scripts/release/build-script-runner-python.sh downloads each file once and refuses it unless
# both the size and the SHA-256 match.
#
# The library versions are the ones CPython 3.13.18's own PCbuild/get_externals.bat names;
# OpenSSL is the official release tarball (its SHA-256 matches openssl.org's published sum).
# Strawberry Perl and NASM are only build tools for OpenSSL: Configure needs a native Windows
# Perl, and NASM assembles its x64 code. They are unpacked under target/ for the build only.
#
# <name> <size-bytes> <sha256> <url>
