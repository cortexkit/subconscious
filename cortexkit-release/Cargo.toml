[package]
name = "cortexkit-release"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared, journaled release state machine for CortexKit repositories."

[[bin]]
name = "ck-release"
path = "src/lib.rs"
test = false
bench = false

[[test]]
name = "release-test-support"
path = "tests/support/mod.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
cortexkit-paths = "0.1.1"
fs4 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subc-jsonc = { path = "../crates/subc-jsonc" }
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
