[package]
name = "ck-bus"
version = "0.1.13"
edition = "2021"
publish = false
description = "Supervised owner of the CortexKit NATS message plane."
license = "MIT"
repository = "https://github.com/cortexkit/subconscious"

[[bin]]
name = "ck-bus"
path = "src/main.rs"

[dependencies]
# ck-bus's own broker connections (system and box users) and stream creation.
async-nats = "0.50"
async-trait = "0.1"
base64 = "0.22"
cortexkit-bus-trait = { version = "0.1.0", git = "https://github.com/cortexkit/commons.git", rev = "4f09c7c7c7f86394d21abde6ed3f97b582ee4d28" }
cortexkit-bus-inmemory = { version = "0.1.0", git = "https://github.com/cortexkit/commons.git", rev = "4f09c7c7c7f86394d21abde6ed3f97b582ee4d28" }
cortexkit-bus-naming = { version = "0.1.0", git = "https://github.com/cortexkit/commons.git", rev = "ce77ea9555d01133763966e3249339d8a3b17467" }
cortexkit-bus-nats = { version = "0.1.0", git = "https://github.com/cortexkit/commons.git", rev = "4f09c7c7c7f86394d21abde6ed3f97b582ee4d28" }
cortexkit-store-types = "0.2.2"
# Base32 for the nkey encoding ck-bus builds from a vault public key (role prefix, base32,
# crc16). Pinned exactly, with nkeys, per the spec's rule for nkey and JWT crates.
data-encoding = "=2.11.1"
# Per-process user keys: generated and held in memory only, never persisted.
nkeys = "=0.4.5"
serde_json = "1"
sha2 = "0.10"
subc-client-rs = { path = "../subc-client-rs", version = "0.19" }
subc-protocol = { path = "../subc-protocol", version = "0.25.0" }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net"] }
subc-control = { path = "../subc-control", version = "0.20" }
subc-daemon = { path = "../subc-daemon", version = "0.21.0", features = ["test-support"] }
subc-jsonc = { path = "../subc-jsonc", version = "0.1.0" }
subc-transport = { path = "../subc-transport", version = "0.7.0" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"
