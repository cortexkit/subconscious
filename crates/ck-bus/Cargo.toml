[package]
name = "ck-bus"
version = "0.13.11"
edition = "2021"
publish = false
description = "Supervised owner of the CortexKit NATS message plane."
license = "MIT"
repository = "https://github.com/cortexkit/subconscious"

[[bin]]
name = "ck-bus"
path = "src/main.rs"

[[test]]
name = "hub_module_issuance"
path = "tests/hub-module-rig/issued.rs"

[features]
test-support = []

[dependencies]
# ck-bus's own broker connections (system and box users) and stream creation.
async-nats = "0.50"
async-trait = "0.1"
base64 = "0.22"
cortexkit-lease = "0.1.3"
cortexkit-bus-trait = "0.3.1"
cortexkit-bus-inmemory = "0.4.0"
cortexkit-bus-naming = "0.5.11"
cortexkit-bus-nats = "0.5.0"
cortexkit-store-types = "0.2.2"
# Base32 for the nkey encoding ck-bus builds from a vault public key (role prefix, base32,
# crc16). Pinned exactly, with nkeys, per the spec's rule for nkey and JWT crates.
data-encoding = "=2.11.1"
# Reads the server's connect and disconnect event subscriptions as one stream.
futures-util = "0.3"
ed25519-dalek = "2"
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
rand_core = { version = "0.9", features = ["os_rng"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# Per-process user keys: generated and held in memory only, never persisted.
nkeys = "=0.4.5"
serde_json = "1"
sha2 = "0.10"
subc-client-rs = { path = "../subc-client-rs", version = "0.43.0" }
subc-protocol = { path = "../subc-protocol", version = "0.37.11" }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
cortexkit-bus-testkit = { path = "../cortexkit-bus-testkit", version = "0.9.6" }
syn = { version = "2", features = ["full", "visit"] }
cortexkit-test-support = "0.1.3"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "test-util"] }
subc-control = { path = "../subc-control", version = "0.43.0" }
subc-daemon = { path = "../subc-daemon", version = "0.54.4", features = ["test-support"] }
subc-jsonc = { path = "../subc-jsonc", version = "0.1.0" }
subc-transport = { path = "../subc-transport", version = "0.18.0" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"
