[package]
name = "ck-inspect"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Read-only supervised process inspection over subc routes."

[features]
test-support = []

[[bin]]
name = "inspect-load-fixture"
path = "tests/fixtures/sample-helper.rs"
required-features = ["test-support"]

[dependencies]
async-trait = "0.1"
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subc-client-rs = { path = "../subc-client-rs", version = "0.32.0" }
subc-control = { path = "../subc-control", version = "0.33.0" }
subc-protocol = { path = "../subc-protocol", version = "0.33.0" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "param"] }

[dev-dependencies]
ck-inspect = { path = ".", version = "0.1.0", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
