[package]
name = "ck-nats-server"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "Supervised owner of the ck-nats-engine local server."

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subc-client-rs = { path = "../subc-client-rs", version = "0.42.0" }
subc-protocol = { path = "../subc-protocol", version = "0.37.2" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }

[dev-dependencies]
subc-transport = { path = "../subc-transport", version = "0.18.0" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
