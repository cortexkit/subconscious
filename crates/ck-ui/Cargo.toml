[package]
name = "ck-ui"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/cortexkit/subconscious"
description = "The ck terminal app: theme, drawing helpers, data model and screens."

[features]
# The built-in fixture (`Snapshot::fixture`), for tests and the demo; normal
# builds don't need it.
fixture = ["dep:serde_json"]

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# Parses the fixture. Don't turn on serde_json features such as
# `float_roundtrip` here: a workspace test run unifies them into every crate,
# and other crates' tests depend on the default parser.
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
unicode-width = "0.2"

[dev-dependencies]
# The crate itself with the fixture, so its tests and examples can use it.
ck-ui = { path = ".", features = ["fixture"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[[example]]
name = "demo"
required-features = ["fixture"]

[lints.rust]
unsafe_code = "forbid"
