[package]
name = "ck-ui"
version = "0.1.5"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/cortexkit/subconscious"
description = "The ck terminal app: theme, drawing helpers, data model and screens."

[features]
# The built-in fixture (`Snapshot::fixture`), for tests and the demo; normal
# builds don't need it.
fixture = []

[dependencies]
# The local UTC offset, for clock times.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# Module replies and health metrics are JSON, and so is the fixture. Don't
# turn on serde_json features such as `float_roundtrip` here: a workspace test
# run unifies them into every crate, and other crates' tests depend on the
# default parser.
serde = "1"
serde_json = "1"
subc-client-rs = { path = "../subc-client-rs", version = "0.30.6" }
subc-control = { path = "../subc-control", version = "0.32.2" }
subc-os = { path = "../subc-os", version = "0.1.18" }
subc-protocol = { path = "../subc-protocol", version = "0.32.8" }
subc-transport = { path = "../subc-transport", version = "0.13.0" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
unicode-width = "0.2"

[dev-dependencies]
# The crate itself with the fixture, so its tests and examples can use it.
ck-ui = { path = ".", features = ["fixture"] }
# test-util: the scheduler's tests run on tokio's paused clock.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }

[[example]]
name = "demo"
required-features = ["fixture"]

[[example]]
name = "live_frame"

[lints.rust]
unsafe_code = "forbid"
