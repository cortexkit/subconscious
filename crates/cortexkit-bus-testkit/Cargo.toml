[package]
name = "cortexkit-bus-testkit"
version = "0.1.2"
edition = "2021"
publish = true
license = "MIT"
repository = "https://github.com/cortexkit/subconscious"
description = "Private, binary-backed NATS and subc daemons for CortexKit module tests."
readme = "README.md"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
cortexkit-test-support = "0.1.9"
nkeys = "=0.4.5"
serde_json = "1"
sha2 = "0.10"
subc-client-rs = { path = "../subc-client-rs", version = "0.30.0" }
subc-control = { path = "../subc-control", version = "0.32.0" }
subc-os = { path = "../subc-os", version = "0.1.14" }
subc-protocol = { path = "../subc-protocol", version = "0.32.0" }
subc-transport = { path = "../subc-transport", version = "0.13.0" }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "rt", "time"] }

[dev-dependencies]
async-nats = "0.50"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
