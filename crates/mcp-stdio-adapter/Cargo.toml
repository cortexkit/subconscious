[package]
name = "mcp-stdio-adapter"
version = "0.1.12"
edition = "2021"
license = "MIT"
publish = false
description = "Resident subc module for configured third-party stdio MCP servers."

[[bin]]
name = "ck-mcp-stdio-adapter"
path = "src/main.rs"

[dependencies]
cortexkit-log = { version = "0.3.3" }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subc-client-rs = { path = "../subc-client-rs", version = "0.27" }
subc-jsonc = { path = "../subc-jsonc" }
subc-protocol = { path = "../subc-protocol", version = "0.30.0" }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["process", "std"] }

[target.'cfg(windows)'.dependencies]
subc-jobobject = { path = "../subc-jobobject" }

[dev-dependencies]
cortexkit-test-support = "0.1.3"
