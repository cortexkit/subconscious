[package]
name = "mcp-stdio-adapter"
version = "0.8.11"
edition = "2021"
license = "MIT"
publish = false
description = "Resident subc module for configured third-party stdio MCP servers."

[[bin]]
name = "ck-mcp-stdio-adapter"
path = "src/main.rs"

[dependencies]
cortexkit-log = { version = "0.3.3" }
cortexkit-store-types = "0.2.2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subc-client-rs = { path = "../subc-client-rs", version = "0.42.0" }
subc-jsonc = { path = "../subc-jsonc", version = "0.1.4" }
subc-os = { path = "../subc-os", version = "0.1.47" }
subc-protocol = { path = "../subc-protocol", version = "0.37.11" }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["process", "std"] }

[target.'cfg(windows)'.dependencies]
subc-jobobject = { path = "../subc-jobobject" }

[dev-dependencies]
cortexkit-test-support = "0.1.3"
subc-daemon = { path = "../subc-daemon", version = "0.53.0", features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
subc-daemon = { path = "../subc-daemon", version = "0.53.0", features = ["dev-desktop-approval", "test-support"] }
subc-transport = { path = "../subc-transport", version = "0.18.0" }
