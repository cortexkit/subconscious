[package]
name = "published-wire-compat"
version = "0.1.0"
edition = "2021"
publish = false

# Decode checked-in wire messages without linking workspace crates, so
# workspace version bumps do not invalidate this crate's lockfile.
[dev-dependencies]
serde_json = "1"
subc-protocol-published = { package = "subc-protocol", version = "=0.37.7" }
subc-control-published = { package = "subc-control", version = "=0.35.0" }
