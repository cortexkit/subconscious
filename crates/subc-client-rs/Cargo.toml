[package]
name = "subc-client-rs"
version = "0.10.1"
edition = "2021"
publish = true
description = "Shared serve + consume client for Rust subc modules."
license = "MIT"
repository = "https://github.com/cortexkit/subconscious"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subc-control = { path = "../subc-control", version = "0.10" }
subc-protocol = { path = "../subc-protocol", version = "0.15" }
subc-transport = { path = "../subc-transport", version = "0.5" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
