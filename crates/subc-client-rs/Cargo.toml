[package]
name = "subc-client-rs"
version = "0.26.0"
edition = "2021"
publish = true
description = "Shared serve + consume client for Rust subc modules."
license = "MIT"
repository = "https://github.com/cortexkit/subconscious"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subc-control = { path = "../subc-control", version = "0.28" }
subc-os = { path = "../subc-os", version = "0.1.3" }
subc-protocol = { path = "../subc-protocol", version = "0.29.0" }
subc-transport = { path = "../subc-transport", version = "0.10" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
subc-test-support = { path = "../subc-test-support" }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time", "test-util"] }
