[package]
name = "subc-core"
version = "0.16.3"
edition = "2021"
license = "MIT"
publish = false
description = "subc daemon core: loopback TCP transport and opaque-byte splice router."

# The crate/library name stays `subc-core` (path-dep'd by ck/subc-probe and
# consumed as the `subc_core` lib), but the daemon EXECUTABLE is `ck-subc` for
# fleet process-name uniformity (all supervised processes are ck-*). Declaring
# this [[bin]] for src/main.rs suppresses the auto `subc-core` binary; the other
# src/bin/*.rs auto-binaries (ck, subc-probe, fake-aft-stub) are unaffected.
[[bin]]
name = "ck-subc"
path = "src/main.rs"

[features]
bench-harness = []
loom = []
# Test-only: enables the `test_support` module (the `TestTempDir` RAII guard)
# for the crate's integration tests. The crate's own unit tests get the module
# via `#[cfg(test)]`; integration tests (a separate crate) enable this feature
# through the self dev-dependency below. Never enabled in a production build.
test-support = []

[[bench]]
name = "forwarding_contention"
path = "benches/forwarding_contention.rs"
harness = false
required-features = ["bench-harness"]

[dependencies]
cortexkit-paths = "0.1.1"
fs4 = "1"
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"
hex-literal = "0.4"
rlimit = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subc-control = { path = "../subc-control" }
subc-jsonc = { path = "../subc-jsonc" }
terminal_size = "0.4"
subc-protocol = { path = "../subc-protocol" }
subc-transport = { path = "../subc-transport" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
# Already in the tree via fs4; safe getuid without an unsafe block.
rustix = { version = "1", default-features = false, features = ["process"] }

[dev-dependencies]
loom = "0.7"
tokio = { version = "1", features = ["test-util"] }
# Self dev-dependency: lets the integration tests (a separate crate) enable the
# `test-support` feature on the library, sharing `test_support::TestTempDir`
# with the crate's own unit tests. Cargo supports a crate depending on itself
# as a dev-dependency for exactly this test-utility-sharing purpose.
subc-core = { path = ".", features = ["test-support"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
