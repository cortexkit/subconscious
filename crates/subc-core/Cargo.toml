[package]
name = "subc-core"
version = "0.9.0"
edition = "2021"
license = "MIT"
publish = false
description = "subc daemon core: loopback TCP transport and opaque-byte splice router."

# The crate/library name stays `subc-core` (path-dep'd by ck/subc-probe and
# consumed as the `subc_core` lib), but the daemon EXECUTABLE is `ck-subc` for
# fleet process-name uniformity (all supervised processes are ck-*). Declaring
# this [[bin]] for src/main.rs suppresses the auto `subc-core` binary; the other
# src/bin/*.rs auto-binaries (ck, subc-probe, fake-aft-stub) are unaffected.
[[bin]]
name = "ck-subc"
path = "src/main.rs"

[features]
bench-harness = []
loom = []

[[bench]]
name = "forwarding_contention"
path = "benches/forwarding_contention.rs"
harness = false
required-features = ["bench-harness"]

[dependencies]
cortexkit-paths = "0.1.1"
fs4 = "1"
getrandom = "0.2"
rlimit = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subc-control = { path = "../subc-control" }
subc-jsonc = { path = "../subc-jsonc" }
terminal_size = "0.4"
subc-protocol = { path = "../subc-protocol" }
subc-transport = { path = "../subc-transport" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
loom = "0.7"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
