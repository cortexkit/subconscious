[package]
name = "subc-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "subc daemon core: loopback TCP transport and opaque-byte splice router."

[features]
bench-harness = []

[[bench]]
name = "forwarding_contention"
path = "benches/forwarding_contention.rs"
harness = false
required-features = ["bench-harness"]

[dependencies]
cortexkit-paths = "0.1"
fs4 = "1"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subc-control = { path = "../subc-control" }
subc-jsonc = { path = "../subc-jsonc" }
subc-protocol = { path = "../subc-protocol" }
subc-transport = { path = "../subc-transport" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "time", "process"] }
tracing = "0.1"
tracing-subscriber = "0.3"
