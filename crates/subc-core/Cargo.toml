[package]
name = "subc-core"
version = "0.20.24"
edition = "2021"
license = "MIT"
publish = false
description = "subc CLI, setup engine, and daemon executable."

# Keep the daemon executable name stable while its library lives in subc-daemon.
[[bin]]
name = "ck-subc"
path = "src/main.rs"

# Keep the shipped CLI explicit because the test-only target shares its source.
# It has no required features, so release builds cannot include test-only code.
[[bin]]
name = "ck"
path = "src/bin/ck.rs"

# Integration tests run this target rather than the shipped `ck`. Its required
# feature makes the test key path a property of the target, never of the Cargo
# invocation.
[[bin]]
name = "ck-under-test"
path = "src/bin/ck-under-test.rs"
required-features = ["test-support"]

[[bin]]
name = "log-child-fixture"
path = "tests/fixtures/log-child.rs"
required-features = ["test-support"]

[features]
bench-harness = ["subc-daemon/bench-harness"]
loom = ["subc-daemon/loom"]
# Enables the dedicated CLI fixture targets, never the shipped CLI test key.
test-support = []

[[bench]]
name = "forwarding_contention"
path = "benches/forwarding_contention.rs"
harness = false
required-features = ["bench-harness"]

[dependencies]
subc-daemon = { path = "../subc-daemon", version = "0.21.0" }
cortexkit-log = { version = "0.3.3" }
cortexkit-paths = "0.1.1"
base64 = "0.22"
ed25519-dalek = "2"
hex-literal = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subc-control = { path = "../subc-control" }
subc-jsonc = { path = "../subc-jsonc" }
terminal_size = "0.4"
subc-protocol = { path = "../subc-protocol" }
subc-transport = { path = "../subc-transport" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "time", "process", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
# Already in the tree via fs4; safe getuid without an unsafe block.
rustix = { version = "1", default-features = false, features = ["process"] }


[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
subc-daemon = { path = "../subc-daemon", version = "0.21.0", features = ["test-support"] }
# Keep required-feature CLI fixture targets enabled for integration tests.
subc-core = { path = ".", features = ["test-support"] }

[lints.rust]
# Package-wide so every target carries it, including the test-only `ck`
# target that `include!`s the shipped source (an inner attribute there would
# not compile inside `include!`).
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
