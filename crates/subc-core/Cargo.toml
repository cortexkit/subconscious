[package]
name = "subc-core"
version = "0.0.0"
edition = "2021"
publish = false
description = "subc daemon core: Unix socket transport and opaque-byte splice router."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subc-protocol = { path = "../subc-protocol" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
