[package]
name = "subc-daemon"
version = "0.18.16"
edition = "2021"
publish = true
description = "Embeddable subc daemon: bootstrap, module supervision, and opaque-byte splice routing."
license = "MIT"
repository = "https://github.com/cortexkit/subconscious"

[features]
bench-harness = []
loom = []
test-support = []

[dependencies]
cortexkit-log = { version = "0.2.0", git = "https://github.com/cortexkit/commons.git", rev = "99736150c6d0c769c1c7479894fba7f07c322a5f" }
cortexkit-paths = "0.1.1"
fs4 = "1"
getrandom = "0.2"
rlimit = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subc-control = { path = "../subc-control", version = "0.13.1" }
subc-jsonc = { path = "../subc-jsonc", version = "0.1.0" }
subc-protocol = { path = "../subc-protocol", version = "0.21.0" }
subc-transport = { path = "../subc-transport", version = "0.7.0" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "time", "process", "signal"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
subc-cgroup = { path = "../subc-cgroup" }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
loom = "0.7"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
