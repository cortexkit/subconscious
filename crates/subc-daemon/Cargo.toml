[package]
name = "subc-daemon"
version = "0.50.58"
edition = "2021"
publish = true
description = "Embeddable subc daemon: bootstrap, module supervision, and opaque-byte splice routing."
license = "MIT"
repository = "https://github.com/cortexkit/subconscious"

[features]
bench-harness = []
loom = []
test-support = ["subc-os/test-support"]
dev-desktop-approval = []
dev-placement = []

[[bin]]
name = "privacy-trampoline-fixture"
path = "tests/fixtures/privacy-trampoline.rs"
required-features = ["test-support"]

[[bin]]
name = "ckdev-config-store-fixture"
path = "tests/fixtures/config-store.rs"
required-features = ["test-support"]

[[bin]]
name = "config-gate-fixture"
path = "src/bin/config-gate-fixture.rs"
required-features = ["test-support"]

[[bin]]
name = "script-runner-fixture"
path = "tests/fixtures/script-runner.rs"
required-features = ["test-support"]

[[bin]]
name = "script-runner-python-fixture"
path = "tests/fixtures/script-runner-python.rs"
required-features = ["test-support"]

[dependencies]
base64 = "0.22"
cortexkit-log = { version = "0.3.3" }
cortexkit-paths = "0.1.1"
cortexkit-project-identity = "=0.1.5"
ed25519-dalek = "2"
fs4 = "1"
getrandom = "0.2"
hmac = "0.12"
memchr = "2"
regex = "1"
rlimit = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1.0.28"
sha2 = "0.10"
subtle = "2"
subc-config = { path = "../subc-config", version = "0.1.11" }
subc-control = { path = "../subc-control", version = "0.42.7" }
subc-jsonc = { path = "../subc-jsonc", version = "0.1.4" }
subc-os = { path = "../subc-os", version = "0.1.52", features = ["tokio"] }
subc-protocol = { path = "../subc-protocol", version = "0.37.8" }
subc-transport = { path = "../subc-transport", version = "0.18.0" }
subc-uptime = { path = "../subc-uptime", version = "0.1.0" }
tokio = { version = "1", features = ["fs", "net", "rt-multi-thread", "macros", "io-util", "sync", "time", "process", "signal"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
subc-cgroup = { path = "../subc-cgroup", version = "0.1.10" }

[target.'cfg(windows)'.dependencies]
# Job-object containment for module grandchildren (issue #109). A leaf crate
# because this crate forbids unsafe code and the Win32 calls need it.
subc-jobobject = { path = "../subc-jobobject", version = "0.2.4" }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Platform bindings stay out of the module SDKs. The CLI shares the Linux
# policy renderer, but authorization decisions belong only to the daemon.
subc-presence = { path = "../subc-presence", version = "0.2.1" }

[target.'cfg(unix)'.dependencies]
# SIGTERM for `protocol: "none"` teardown, and poll(2) so a module's output
# pipes can be read with a stop signal. This crate forbids unsafe code, so libc
# is not reachable from here; rustix wraps the same syscalls safely and is
# already in the tree via subc-transport.
rustix = { version = "1", default-features = false, features = ["event", "process", "fs"] }

[dev-dependencies]
subc-control-published = { package = "subc-control", version = "=0.35.0" }
subc-os = { path = "../subc-os", version = "0.1.52", features = ["test-support"] }
cortexkit-test-support = "0.1.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
loom = "0.7"
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["net"] }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
