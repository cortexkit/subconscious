[package]
name = "subc-daemon"
version = "0.38.5"
edition = "2021"
publish = true
description = "Embeddable subc daemon: bootstrap, module supervision, and opaque-byte splice routing."
license = "MIT"
repository = "https://github.com/cortexkit/subconscious"

[features]
bench-harness = []
loom = []
test-support = ["subc-os/test-support"]

[[bin]]
name = "privacy-trampoline-fixture"
path = "tests/fixtures/privacy-trampoline.rs"
required-features = ["test-support"]

[dependencies]
base64 = "0.22"
cortexkit-log = { version = "0.3.3" }
cortexkit-paths = "0.1.1"
fs4 = "1"
getrandom = "0.2"
memchr = "2"
rlimit = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1.0.28"
sha2 = "0.10"
subtle = "2"
subc-control = { path = "../subc-control", version = "0.33.4" }
subc-jsonc = { path = "../subc-jsonc", version = "0.1.0" }
subc-os = { path = "../subc-os", version = "0.1.23", features = ["tokio"] }
subc-protocol = { path = "../subc-protocol", version = "0.33.5" }
subc-transport = { path = "../subc-transport", version = "0.14.0" }
subc-uptime = { path = "../subc-uptime", version = "0.1.0" }
tokio = { version = "1", features = ["fs", "net", "rt-multi-thread", "macros", "io-util", "sync", "time", "process", "signal"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
subc-cgroup = { path = "../subc-cgroup", version = "0.1.5" }

[target.'cfg(windows)'.dependencies]
# Job-object containment for module grandchildren (issue #109). A leaf crate
# because this crate forbids unsafe code and the Win32 calls need it.
subc-jobobject = { path = "../subc-jobobject", version = "0.2.2" }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
# The OS authentication prompts live only in the daemon. Keeping them in their
# own crate, depended on here and nowhere else, keeps those platform bindings
# out of subc-client-rs and the other crates modules build against.
subc-presence = { path = "../subc-presence", version = "0.1.2" }

[target.'cfg(unix)'.dependencies]
# SIGTERM for `protocol: "none"` teardown. This crate forbids unsafe code, so
# `libc::kill` is not reachable from here; rustix wraps the same syscall safely
# and is already in the tree via subc-transport.
rustix = { version = "1", default-features = false, features = ["process"] }

[dev-dependencies]
subc-os = { path = "../subc-os", version = "0.1.23", features = ["test-support"] }
cortexkit-test-support = "0.1.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
loom = "0.7"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
