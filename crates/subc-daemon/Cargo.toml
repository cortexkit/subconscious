[package]
name = "subc-daemon"
version = "0.21.14"
edition = "2021"
publish = true
description = "Embeddable subc daemon: bootstrap, module supervision, and opaque-byte splice routing."
license = "MIT"
repository = "https://github.com/cortexkit/subconscious"

[features]
bench-harness = []
loom = []
test-support = []

[dependencies]
cortexkit-log = { version = "0.3.3" }
cortexkit-paths = "0.1.1"
fs4 = "1"
getrandom = "0.2"
memchr = "2"
rlimit = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subc-control = { path = "../subc-control", version = "0.21" }
subc-jsonc = { path = "../subc-jsonc", version = "0.1.0" }
subc-os = { path = "../subc-os", version = "0.1.1" }
subc-protocol = { path = "../subc-protocol", version = "0.25.0" }
subc-transport = { path = "../subc-transport", version = "0.7.0" }
subc-uptime = { path = "../subc-uptime", version = "0.1.0" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "time", "process", "signal"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
subc-cgroup = { path = "../subc-cgroup", version = "0.1.1" }

[target.'cfg(windows)'.dependencies]
# Job-object containment for module grandchildren (issue #109). A leaf crate
# because this crate forbids unsafe code and the Win32 calls need it.
subc-jobobject = { path = "../subc-jobobject", version = "0.1.0" }

[target.'cfg(unix)'.dependencies]
# SIGTERM for `protocol: "none"` teardown. This crate forbids unsafe code, so
# `libc::kill` is not reachable from here; rustix wraps the same syscall safely
# and is already in the tree via subc-transport.
rustix = { version = "1", default-features = false, features = ["process"] }

[dev-dependencies]
subc-test-support = { path = "../subc-test-support" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
loom = "0.7"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
