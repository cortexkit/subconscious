[package]
name = "subc-daemon-consumer"
version = "0.0.2"
edition = "2021"
publish = false

[dev-dependencies]
cortexkit-test-support = "0.1.3"
subc-daemon = { path = "../..", version = "0.33", features = ["test-support"] }
subc-protocol = { path = "../../../subc-protocol", version = "0.30.0" }
subc-transport = { path = "../../../subc-transport", version = "0.11" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[lints.rust]
unsafe_code = "forbid"
