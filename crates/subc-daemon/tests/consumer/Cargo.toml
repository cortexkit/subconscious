[package]
name = "subc-daemon-consumer"
version = "0.0.0"
edition = "2021"
publish = false

[dev-dependencies]
subc-test-support = { path = "../../../subc-test-support" }
subc-daemon = { path = "../..", features = ["test-support"] }
subc-protocol = { path = "../../../subc-protocol" }
subc-transport = { path = "../../../subc-transport" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[lints.rust]
unsafe_code = "forbid"
