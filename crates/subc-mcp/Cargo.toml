[package]
name = "subc-mcp"
version = "0.1.24"
edition = "2021"
license = "MIT"
publish = false
description = "subc MCP integration skeleton: thin stdio shim and two-faced module (no MCP yet)."

# Package stays `subc-mcp` (path-dep'd, `cargo build -p subc-mcp`); the
# executable is `ck-subc-mcp` for fleet process-name uniformity.
[[bin]]
name = "ck-subc-mcp"
path = "src/main.rs"

[dependencies]
cortexkit-log = { version = "0.3.3" }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "1.7", default-features = false, features = ["server", "transport-async-rw"] }
subc-control = { path = "../subc-control", version = "0.28" }
subc-jsonc = { path = "../subc-jsonc" }
subc-os = { path = "../subc-os" }
subc-protocol = { path = "../subc-protocol", version = "0.29.0" }
subc-transport = { path = "../subc-transport", version = "0.10" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "process"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
subc-test-support = { path = "../subc-test-support" }
rmcp = { version = "1.7", default-features = false, features = ["client", "transport-async-rw"] }
subc-daemon = { path = "../subc-daemon", version = "0.31.0" }
