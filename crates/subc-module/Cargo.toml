[package]
name = "subc-module"
version = "0.1.0"
edition = "2021"
publish = true
description = "Shared serve-side helper for Rust subc modules."
license = "MIT"
repository = "https://github.com/cortexkit/subconscious"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subc-protocol = { path = "../subc-protocol", version = "0.4" }
subc-transport = { path = "../subc-transport", version = "0.2" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
