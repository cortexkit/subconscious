[package]
name = "subc-os"
version = "0.1.4"
edition = "2021"
license = "MIT"
publish = true
repository = "https://github.com/cortexkit/subconscious"
description = "Operating-system primitives for the subc daemon that need unsafe code, behind a safe API: per-process identity, signalling, memory and CPU usage, and the launch-nonce descriptor handoff."

# The launch-nonce handoff (dup2 and fcntl between fork and exec) and its
# reader (fstat, ioctl) are plain POSIX calls, so every Unix takes libc.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["event", "param", "process", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "1", default-features = false, features = ["process", "std"] }

# Tests measure busy work on the thread's own CPU clock, a reading independent
# of the process-usage API they check.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }

[lints.rust]
unsafe_code = "deny"
