[package]
name = "subc-protocol"
version = "0.0.0"
edition = "2021"
publish = false
description = "Shared wire contract for subc <-> modules: the 17-byte envelope, JSON-RPC body shapes, and the capability manifest. Single source of truth, depended on by subc-core and AFT."

[dependencies]
# Envelope remains pure std; serde is used only by body/manifest schemas.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
