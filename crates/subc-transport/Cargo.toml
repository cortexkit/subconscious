[package]
name = "subc-transport"
version = "0.5.1"
edition = "2021"
publish = true
description = "subc loopback-TCP + key transport: pre-envelope auth handshake, connection-file discovery, and async envelope frame I/O."
license = "MIT"
repository = "https://github.com/cortexkit/subconscious"

[dependencies]
getrandom = "0.2"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subc-protocol = { path = "../subc-protocol", version = "0.16" }
subtle = "2"
tokio = { version = "1", features = ["io-util", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time", "test-util"] }
