old = "let report = dispatcher.fold_health(handler.health().await);"
new = """
let _permit = dispatcher.permits.acquire().await.unwrap(); // NON-VACUITY BREAK
            let report = dispatcher.fold_health(handler.health().await);"""
edits = []
test_file = "crates/subc-client-rs/src/lib.rs"
