[[control]]
id = "privacy-missing-symbol-fails-closed"
guards = "A missing private disclaim symbol refuses execution rather than falling back"
file = "crates/subc-os/src/privacy_identity.rs"
old = "let disclaim = resolve_disclaim(missing_symbol)?;"
new = """
#[allow(unsafe_code)]
        unsafe extern "C" fn missing_symbol_fallback(
            _: *mut libc::posix_spawnattr_t, _: libc::c_int,
        ) -> libc::c_int { 0 }
        let disclaim: Disclaim = resolve_disclaim(missing_symbol).unwrap_or(missing_symbol_fallback); // NON-VACUITY BREAK: fall through to ordinary SETEXEC"""
edits = []
test_file = "crates/subc-core/tests/privacy_identity.rs"
runner = "nextest"
package = "subc-core"
target = "--test privacy_identity"
expect_red = ["macos_missing_symbol_fails_closed_without_exec"]
only = false
hub = "A missing disclaim API is a launch refusal: neither stub execution nor a published module pid is permitted. Privacy isolation and refused-launch provenance guard that same fail-closed boundary."
hub_targets = ["subc-core::provenance"]
platforms = ["macos"]
timeout_s = 600
build_timeout_s = 1800


