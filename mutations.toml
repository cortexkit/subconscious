only = true
timeout_s = 600
build_timeout_s = 1800


[[control]]
id = "privacy-reports-only-confirmed-pid"
guards = "Reporting must hide the trampoline pid until acknowledged module exec"
file = "crates/subc-daemon/src/supervise.rs"
old = "state.report_ready = Some(Arc::clone(&child.report_ready));"
new = """
let _ = child.report_ready.set(()); // NON-VACUITY BREAK
        state.report_ready = Some(Arc::clone(&child.report_ready));"""
edits = []
test_file = "crates/subc-core/tests/provenance.rs"
runner = "nextest"
package = "subc-core"
target = "--test provenance"
expect_red = ["macos_status_and_provenance_publish_only_a_confirmed_module_pid", "macos_refused_trampoline_never_publishes_a_module_pid"]
only = false
hub = "Status, in-process provenance and CLI provenance must all withhold the trampoline pid/image until module exec is confirmed; the privacy CLI test independently guards the same publication boundary."
hub_targets = ["subc-core::privacy_identity"]
platforms = ["macos"]
timeout_s = 600
build_timeout_s = 1800


[[control]]
id = "privacy-roster-withholds-the-early-trampoline-image"
guards = "The early non-null trampoline image must not enter the roster before module exec confirmation"
file = "crates/subc-daemon/src/supervise.rs"
old = """
let recorded_image = if privacy_exec.is_some() {
        None"""
new = """
let recorded_image = if privacy_exec.is_some() {
        recorded_image // NON-VACUITY BREAK"""
edits = []
test_file = "crates/subc-daemon/src/supervise.rs"
runner = "nextest"
package = "subc-daemon"
target = "--lib"
expect_red = ["supervise::privacy_exec_boundary_tests::macos_roster_withholds_a_nonnull_trampoline_image_until_exec_confirmation"]
# Recording the trampoline's image as the module's also breaks other tests that
# read the roster image (orphan identity, HTTP health), but only when a test's
# sample lands before exec confirmation, so they go red on some runs and not
# others. The expected test holds the launch at that point and fails every time.
only = false
platforms = ["macos"]
timeout_s = 600
build_timeout_s = 1800


