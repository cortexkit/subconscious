[package]
name = "gpui-subcchat-spike"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately its OWN workspace rather than a member of the root one, and this
# is a decision rather than an oversight: gpui pulls a very large dependency
# tree, and joining the root workspace would put that build cost on every
# `cargo test` in the daemon crates.
#
# THE COST THIS ACCEPTS, stated so nobody has to rediscover it: standing outside
# the workspace means CI never builds this crate, so a change that breaks it
# lands green. That was harmless while this was an evaluation spike. It is less
# harmless now -- this crate holds live wire strings (module ids, op names) that
# move when the fleet renames a module, and a stale one here fails at runtime on
# a real daemon rather than at compile time in CI.
#
# A FIX WOULD HAVE TO PRESERVE the root workspace's build time. A separate CI job
# that builds only this crate on changes under spikes/ does that; adding it to
# the workspace members does not. Until then, changes here need a local build --
# which is why the fleet rename work built it by hand rather than trusting green.
[workspace]

[dependencies]
anyhow = "1"
# gpui_platform is not published on crates.io at 0.2.x; gpui 0.2.2 now owns
# platform selection directly. runtime_shaders also makes CLT-only Macs usable.
gpui = { version = "=0.2.2", features = ["font-kit", "runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subc-client-rs = { path = "../../crates/subc-client-rs" }
subc-protocol = { path = "../../crates/subc-protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
